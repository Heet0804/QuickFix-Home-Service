<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>QuickFix — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/auth/auth.css">
</head>
<body>

<div class="left">
  <a class="left-logo" href="landing.html">
    <div class="logo-mark">Q</div>
    <span>Quick<em>Fix</em></span>
  </a>
  <span class="left-mobile-tag">Trusted local<br/>services on demand</span>
  <div class="left-main" id="leftMain"></div>
  <div class="left-footer">© 2025 QuickFix &nbsp;·&nbsp; <a href="landing.html">Home</a></div>
</div>

<div class="right">
  <a class="back-link" href="landing.html">← Back to Home</a>
  <div class="role-toggle">
    <button class="rtab on" id="tabUser" onclick="setRole('user')">🏠 I'm a User</button>
    <button class="rtab" id="tabWorker" onclick="setRole('worker')">🔧 I'm a Worker</button>
  </div>
  <div class="auth-box">
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to book services near you.</p>
    <div class="form-tabs">
      <button class="ftab on" id="ftLogin" onclick="setForm('login')">Sign In</button>
      <span class="ftab-sep">/</span>
      <button class="ftab" id="ftSignup" onclick="setForm('signup')">Create Account</button>
    </div>
    <div class="err-banner" id="errBanner"></div>

    <!-- LOGIN -->
    <div class="form-panel on" id="fLogin">
      <div class="fg"><label class="flabel">Email Address</label><input type="email" class="finput" id="lEmail" placeholder="you@email.com" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <div class="fg"><label class="flabel">Password</label><input type="password" class="finput" id="lPass" placeholder="Your password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <div style="text-align:right;margin-bottom:1rem"><a href="#" onclick="forgotPassword(event)" style="font-size:.78rem;color:var(--brand);font-weight:600;text-decoration:none">Forgot password?</a></div>
      <button class="submit-btn" id="loginBtn" onclick="doLogin()"><span id="loginBtnTxt">Sign In →</span></button>
    </div>

    <!-- SIGNUP USER -->
    <div class="form-panel" id="fSignupUser">
      <div class="frow">
        <div class="fg"><label class="flabel">First Name *</label><input type="text" class="finput" id="suFname" placeholder="Rahul"/></div>
        <div class="fg"><label class="flabel">Last Name</label><input type="text" class="finput" id="suLname" placeholder="Sharma"/></div>
      </div>
      <div class="fg"><label class="flabel">Email Address *</label><input type="email" class="finput" id="suEmail" placeholder="you@email.com"/></div>
      <div class="fg"><label class="flabel">Phone Number *</label><input type="tel" class="finput" id="suPhone" placeholder="+91 98765 43210"/></div>
      <div class="fg"><label class="flabel">Password * <span style="font-size:.68rem;color:var(--text3)">(min 6 characters)</span></label><input type="password" class="finput" id="suPass" placeholder="Create a password"/></div>
      <button class="submit-btn" id="signupUserBtn" onclick="doSignup('user')"><span id="suBtnTxt">Create Account →</span></button>
    </div>

    <!-- SIGNUP WORKER -->
    <div class="form-panel" id="fSignupWorker">
      <div class="frow">
        <div class="fg"><label class="flabel">Full Name *</label><input type="text" class="finput" id="swName" placeholder="Your name"/></div>
        <div class="fg"><label class="flabel">Phone *</label><input type="tel" class="finput" id="swPhone" placeholder="+91 98765 43210"/></div>
      </div>
      <div class="fg"><label class="flabel">Email Address *</label><input type="email" class="finput" id="swEmail" placeholder="you@email.com"/></div>
      <div class="frow">
        <div class="fg"><label class="flabel">Skill / Category *</label>
          <select class="fselect" id="swSkill" onchange="toggleEmergencyField()">
            <option value="">Select…</option>
            <option>Electrician</option><option>Plumber</option><option>Carpenter</option>
            <option>Painter</option><option>Cleaner</option><option>AC Repair</option>
            <option>Mason</option><option>Pest Control</option><option>Househelp</option>
          </select>
        </div>
        <div class="fg"><label class="flabel">Work Radius (km) *</label><input type="number" class="finput" id="swRadius" placeholder="e.g. 10" min="1"/></div>
      </div>
      <div class="fg"><label class="flabel">Area *</label>
        <select class="fselect" id="swArea">
          <option value="">Loading areas…</option>
        </select>
      </div>
      <div class="fg"><label class="flabel">Years of Experience *</label><input type="number" class="finput" id="swExp" placeholder="e.g. 3" min="0"/></div>
      <div class="fg" id="swEmergGrp" style="display:none">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;background:#fdfaf7;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.7rem .95rem">
          <input type="checkbox" id="swEmerg" style="width:16px;height:16px;flex-shrink:0;accent-color:var(--brand)"/>
          <span style="font-size:.82rem;font-weight:600;color:var(--text2)">Available During Emergency Hours (9:30 PM - 9:30 AM)</span>
        </label>
      </div>
      <div class="fg" id="swDocGrp">
        <label class="flabel">Government ID Proof (Aadhaar / PAN) *</label>
        <label class="file-upload-label" id="swDocLabel" for="swDocFile">
          <span class="file-upload-icon">📄</span>
          <span class="file-upload-main">Click to upload or drag &amp; drop</span>
          <span class="file-upload-sub">Accepted: JPG, JPEG, PNG, PDF · Max 5MB</span>
          <span class="file-upload-name" id="swDocName" style="display:none"></span>
          <input type="file" id="swDocFile" accept=".jpg,.jpeg,.png,.pdf" onchange="handleDocUpload(this)"/>
        </label>
      </div>
      <div class="fg" id="swPhotoGrp">
        <label class="flabel">Profile Photo *</label>
        <label class="file-upload-label" id="swPhotoLabel" for="swPhotoFile">
          <span class="file-upload-icon">🙂</span>
          <span class="file-upload-main">Click to upload or take a photo</span>
          <span class="file-upload-sub">Accepted: JPG, JPEG, PNG · Max 5MB</span>
          <span class="file-upload-name" id="swPhotoName" style="display:none"></span>
          <input type="file" id="swPhotoFile" accept="image/*" capture="user" onchange="handlePhotoUpload(this)"/>
        </label>
      </div>
      <div class="fg"><label class="flabel">Password * <span style="font-size:.68rem;color:var(--text3)">(min 6 characters)</span></label><input type="password" class="finput" id="swPass" placeholder="Create a password"/></div>
      <button class="submit-btn" id="signupWorkerBtn" onclick="doSignup('worker')"><span id="swBtnTxt">Register as Worker →</span></button>
    </div>

    <div class="divider">or continue with</div>
    <div class="social-btns">
      <button class="sbtn" onclick="showToast('📌 Google auth coming soon')">🔵 Google</button>
      <button class="sbtn" onclick="showToast('📌 Phone OTP coming soon')">📱 Phone OTP</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/common/supabase.js"></script>
<script src="js/auth/auth.js"></script>
</body>
</html>
